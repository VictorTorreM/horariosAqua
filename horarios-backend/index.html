<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aquasella 2026 · Horarios</title>
  <meta name="description" content="Horarios del festival Aquasella 2026, día a día y escenario a escenario." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="cabecera">
    <div class="cabecera__glow" aria-hidden="true"></div>

    <div class="cabecera__marca">
      <span class="cabecera__logo">AQUASELLA</span>
      <span class="cabecera__sub">Horarios · 13&ndash;16 agosto 2026</span>
    </div>

    <nav class="cabecera__vistas" aria-label="Vista">
      <button type="button" class="chip-vista is-activo" data-vista="horario">Lista</button>
      <button type="button" class="chip-vista" data-vista="cuadricula">Cuadrícula</button>
      <button type="button" class="chip-vista" data-vista="favoritos">
        Favoritos <span class="contador-favoritos" id="contador-favoritos" hidden>0</span>
      </button>
    </nav>

    <div class="tabs-dias" id="tabs-dias" role="tablist" aria-label="Día del festival">
      <!-- Se rellena por JS -->
    </div>

    <div class="chips-escenarios" id="chips-escenarios" role="tablist" aria-label="Escenario">
      <!-- Se rellena por JS -->
    </div>
  </header>

  <main id="contenido" class="contenido">
    <p class="estado-carga" id="estado-carga">Cargando horarios…</p>
  </main>

  <template id="plantilla-fila-actuacion">
    <li class="fila-actuacion">
      <span class="fila-actuacion__hora"></span>
      <div class="fila-actuacion__info">
        <p class="fila-actuacion__artista">
          <span class="fila-actuacion__nombre"></span>
          <span class="etiqueta-live" hidden>LIVE</span>
        </p>
        <p class="fila-actuacion__meta"></p>
      </div>
      <button type="button" class="boton-favorito" aria-pressed="false" aria-label="Marcar como favorito">
        <svg viewBox="0 0 24 24" class="icono-corazon" aria-hidden="true">
          <path d="M12 21s-7.5-4.7-10.2-9.3C.2 8.9 1.4 5.3 4.7 4.4c2-.5 4 .3 5.3 2 .5.6.9 1.3 1.2 1.9.3-.6.7-1.3 1.2-1.9 1.3-1.7 3.3-2.5 5.3-2 3.3.9 4.5 4.5 2.9 7.3C19.5 16.3 12 21 12 21z" />
        </svg>
      </button>
    </li>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
